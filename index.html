<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>anticheat Scanner</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #bb86fc;
            --danger: #cf6679;
            --success: #03dac6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 20px;
            text-align: center;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }
        input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .btn {
            background-color: var(--accent);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            display: block;
            text-align: center;
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.7;
        }
        #status {
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
            text-align: center;
        }
        #results {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }
        .result-item {
            background-color: var(--card-bg);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid var(--danger);
            word-break: break-all;
        }
        .result-item.clean {
            border-left-color: var(--success);
        }
        .loading {
            display: none;
            color: var(--accent);
            margin-top: 10px;
        }
    </style>
</head>

        const fileInput = document.getElementById('fileInput');
        const statusEl = document.getElementById('status');
        const loader = document.getElementById('loader');
        const resultsEl = document.getElementById('results');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusEl.textContent = `Selected: ${file.name}`;
            resultsEl.innerHTML = '';
            loader.style.display = 'block';

            try {
                const buffer = await file.arrayBuffer();
                const decoder = new TextDecoder('latin1'); // Use latin1 to read raw bytes as strings
                const content = decoder.decode(buffer);
                
                const found = [];
                const totalKeywords = ANTI_CHEAT_KEYWORDS.length;
                let checked = 0;

                // Process in chunks to keep UI responsive
                await new Promise(resolve => setTimeout(resolve, 10));

                for (const keyword of ANTI_CHEAT_KEYWORDS) {
                    // Convert keyword byte array to string for searching
                    const kwStr = new TextDecoder().decode(keyword);
                    if (content.includes(kwStr)) {
                        found.push(kwStr);
                    }
                    
                    checked++;
                    if (checked % 100 === 0) {
                        statusEl.textContent = `Scanning... ${Math.round((checked / totalKeywords) * 100)}%`;
                        await new Promise(r => setTimeout(r, 0)); // Yield to UI
                    }
                }

                loader.style.display = 'none';
                
                if (found.length === 0) {
                    resultsEl.innerHTML = `<div class="result-item clean">✅ No cheats detected.</div>`;
                } else {
                    resultsEl.innerHTML = `<div style="margin-bottom:10px; color:var(--danger);">${found.length} Cheats Detected!</div>` + 
                        found.map(k => `<div class="result-item"><strong>${k}</strong></div>`).join('');
                }

            } catch (err) {
                loader.style.display = 'none';
                statusEl.textContent = 'Error reading file.';
                console.error(err);
            }
        });
