            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e84118;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #ccc;
        }
        .log {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
            background: #222;
            padding: 0.5rem;
            text-align: left;
            font-size: 0.8rem;
            border-radius: 5px;
        }
        .log div {
            margin: 0.2rem 0;
        }
        .success { color: #2ecc71; }
        .error { color: #ff6b6b; }

            const div = document.createElement('div');
            div.textContent = message;
            div.className = type;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function scanAndRemove() {
            const input = document.getElementById('folderInput');
            if (!input.files.length) {
                alert("Please select a folder first.");
                return;
            }

            statusDiv.textContent = "Scanning...";
            logDiv.innerHTML = '';
            
            let removedCount = 0;
            let scannedCount = 0;

            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                
                // Only check DLLs and EXEs
                if (!file.name.endsWith('.dll') && !file.name.endsWith('.exe')) continue;

                scannedCount++;
                
                try {
                    const text = await readFileAsText(file);
                    const foundKeywords = ANTI_CHEAT_KEYWORDS.filter(keyword => text.includes(keyword));
                    
                    if (foundKeywords.length > 0) {
                        log(`Found cheats in: ${file.name}`, 'error');
                        // In a real browser environment, we can't easily delete files without user permission or File System Access API
                        // For this demo, we'll just log it. To actually remove, you'd need a backend or Electron app.
                        // Here we simulate removal by marking it.
                        removedCount++;
                    } else {
                        log(`Clean: ${file.name}`, 'success');
                    }
                } catch (e) {
                    log(`Error reading ${file.name}: ${e.message}`, 'error');
                }
            }

            statusDiv.textContent = `Done. Scanned: ${scannedCount}, Cheats Found: ${removedCount}`;
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
